<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"> <title>Workout </title> <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Poppins', sans-serif; 
        background: url('exercise routine 2026.jpeg') no-repeat center center fixed;
        background-size: auto;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        margin: 0;
    }

    .card {
        background: white;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        max-width: 350px;
    }

    h1 {
        color: #ff4d6d;
    }

    button {
        padding: 10px 20px;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        cursor: pointer;
        margin: 10px;
    }

    #yes {
        background-color: #ff4d6d;
        color: white;
    }

    #no {
        background-color: #ccc;
        position: absolute;
    }
</style>
</head>
<body>

<div class="card" id="card">
    <h1>Hey Girls 💕</h1>
    <p>Should we start working out today?💪</p>
    <button id="yes" onclick="yesClicked()">YES 🔥</button>
    <button id="no">NO 😅</button>
</div>

<script>
const noBtn = document.getElementById("no");
noBtn.addEventListener("mouseover", moveNo);
noBtn.addEventListener("click", moveNo);

function moveNo() {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}
    function yesClicked() {
    const messages = [
        "💪 Let’s crush it today!",
        "Time to lift heavy and leave no reps behind 🏋️‍♂️",
        "🔥 Push yourself, no limits!",
        "🏃‍♀️ Run, sweat, repeat!",
        "Stronger every set 💪",
        "Feel the burn, love the gains 🔥",
        "One more rep, one step closer!",
        "Sweat now, shine later ✨",
        "No excuses, just results 💥",
        "Lift. Run. Repeat. Dominate. 💪"
    ];
    const msg = messages[Math.floor(Math.random() * messages.length)];
    document.getElementById("card").innerHTML = `
        <h1>YES! 💪</h1>
        <p>${msg}</p>
        <p><strong>Message the time in the group ⏰</strong></p>
    `;
}

}
</script>

</body>
</html>
